:root{
  --ink:#14213D; --muted:#566079; --sand:#FFF7EC; --line:#EBDDC9;
  --coral:#E0553F; --sun:#FFC93C; --sunlite:#FFE27A; --ocean:#0A6FB8; --aqua:#0E8582; --aqualite:#E3F6F5;
  --lilac:#6E4FCB; --pink:#D63A6F; --leaf:#23864F; --orange:#C8661A; --deep:#0F4C81;
  --display:'Bricolage',"Segoe UI Black","Arial Black",system-ui,sans-serif;
  --body:'Lexend',Calibri,Carlito,"Segoe UI",Arial,sans-serif;
  --r:24px;
}
html[data-size="1"]{font-size:20px}
html[data-size="2"]{font-size:24px}
html[data-size="3"]{font-size:28px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background-color:var(--sand);background-image:radial-gradient(circle at 1px 1px, rgba(224,85,63,.13) 1.5px, transparent 0);background-size:26px 26px;
  color:var(--ink);font-family:var(--body);line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
button,textarea{font:inherit}
button:focus-visible,textarea:focus-visible{outline:4px solid var(--sun);outline-offset:2px}

/* top bar */
.top{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 14px;background:#fff;position:relative;z-index:20}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;white-space:nowrap;margin-right:auto}
.brand span{color:var(--coral)}
.tb{min-height:2.3rem;padding:.2rem .8rem;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:.8rem;cursor:pointer;white-space:nowrap}
.pickbtn{min-height:2.5rem;padding:.25rem 1rem;border-radius:99px;border:0;background:var(--coral);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.pickbtn.pairb{background:var(--lilac)}

/* tabs */
.tabs{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 10px;background:#fff;position:relative;z-index:19;scrollbar-width:thin}
.tabs::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--ocean),var(--aqua),var(--sun),var(--coral),var(--pink))}
.tab{flex:none;display:flex;align-items:center;gap:.4rem;min-height:2.3rem;padding:.2rem .8rem .2rem .3rem;border-radius:99px;border:2px solid var(--c);background:#fff;color:var(--c);font-weight:700;font-size:.72rem;cursor:pointer;margin-bottom:6px}
.tab i{font-style:normal;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.tab.on{background:var(--c);color:#fff}
.tab.on i{background:#fff;color:var(--c)}

/* stage */
.stage{flex:1;min-height:0;overflow:auto}
.slide{max-width:1500px;margin:0 auto;padding:1rem 3vw 1.4rem}
.kick{display:inline-block;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--k,var(--ocean));padding:.2rem .7rem;border-radius:99px;margin-bottom:.3rem}
h2{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1;margin:0 0 .7rem;font-size:2.1rem}
h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 .5rem;font-size:1.25rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17em),1fr));gap:1rem;align-items:start}
.panel{background:#fff;border-radius:var(--r);padding:1rem 1.1rem;box-shadow:0 7px 0 #F3E3CC;border-top:10px solid var(--c,var(--ocean))}
.say{background:#FFF0EC;border:3px solid #FFD2C8;border-radius:18px;padding:.7rem 1rem;margin:0 0 .8rem}
.say b.lab{display:block;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:.15rem}
.say q{display:block;font-size:1rem;font-weight:600;color:#3A1F18;quotes:"\201C" "\201D"}
.say q + q{margin-top:.35rem;padding-top:.35rem;border-top:2px dashed #FFC2B5}
.ex{background:var(--sunlite);border-bottom:4px solid var(--pink);border-radius:8px;padding:0 .25rem;color:var(--ink);font-weight:700}
.tip{background:var(--aqualite);border:3px solid #BFE7E5;border-radius:18px;padding:.6rem 1rem;margin:0 0 .8rem;font-size:.9rem}
.tip b.lab{display:block;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--aqua)}
.band{display:flex;align-items:center;gap:.7rem;background:var(--ink);color:#fff;border-radius:18px;padding:.6rem 1rem;margin:0 0 .8rem;font-weight:600;font-size:.95rem}
.band span{font-size:1.5rem}
.btn{min-height:2.3rem;padding:.25rem 1rem;border-radius:99px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.btn.go{background:var(--leaf)}.btn.sea{background:var(--ocean)}.btn.cor{background:var(--coral)}.btn.lil{background:var(--lilac)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}

/* polls */
.poll{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,6.5em),1fr));gap:.6rem;margin:0 0 .6rem}
.pt{position:relative;min-height:4.6rem;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;padding:.4rem;color:var(--ink)}
.pt .em{font-size:1.9rem;line-height:1}
.pt .lb{font-weight:700;font-size:.8rem;text-align:center;line-height:1.1}
.pt .ct{position:absolute;top:-.6rem;right:-.5rem;min-width:1.8rem;height:1.8rem;border-radius:99px;background:var(--coral);color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:.85rem;padding:0 .35rem;border:3px solid #fff}
.pt .ct.z{display:none}
.pt.top{border-color:var(--coral);background:#FFF0EC}
.pollfoot{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:.4rem}
.pollfoot button{min-height:2rem;padding:.1rem .7rem;border-radius:99px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:.7rem;cursor:pointer;color:var(--muted)}

/* question card */
.qcard{background:linear-gradient(135deg,var(--ocean),var(--aqua));color:#fff;border-radius:var(--r);padding:1rem 1.2rem}
.qcard small{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.6rem;opacity:.9}
.qcard p{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1;margin:.3rem 0 .7rem}
.qcard .btn.ghost{border-color:#fff}

/* frames by type */
.ftabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
.ftab{min-height:2.2rem;padding:.15rem .9rem;border-radius:99px;border:3px solid var(--c);background:#fff;color:var(--c);font-weight:700;font-size:.75rem;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
.ftab.on{background:var(--c);color:#fff}

/* talk list */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10em),1fr));gap:.4rem}
.tpick{display:flex;align-items:center;gap:.5rem;min-height:2.4rem;text-align:left;padding:.2rem .6rem;border-radius:14px;border:2px solid var(--line);border-left:8px solid var(--c);background:#fff;color:var(--ink);font-weight:700;font-size:.72rem;cursor:pointer}
.tpick .tk{flex:none;width:1.3rem;height:1.3rem;border-radius:50%;border:2px dashed #C9B89F;display:grid;place-items:center;color:#fff;font-size:.7rem}
.tpick.on{background:#E6F6EC;border-color:#9ED3B2;border-left-color:var(--c)}
.tpick.on .tk{background:var(--leaf);border:2px solid var(--leaf)}

/* story */
.seq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;margin-bottom:.8rem}
.sq{background:#fff;border-radius:20px;box-shadow:0 6px 0 #F3E3CC;padding:.7rem .8rem;border-top:10px solid var(--c)}
.sq b{display:block;font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--c)}
.sq p{margin:.2rem 0 0;font-weight:600;font-size:.85rem}
.verbs{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .8rem}
.verbs span{background:#fff;border:2px solid var(--line);border-radius:99px;padding:.1rem .7rem;font-weight:700;font-size:.85rem}
.model{background:#fff;border-radius:var(--r);padding:1rem 1.2rem;box-shadow:0 7px 0 #F3E3CC;font-size:1rem;font-weight:500}
.model p{margin:0 0 .4rem}
.model b{color:var(--coral)}
.model[hidden]{display:none}

/* expressions */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,8.5em),1fr));gap:.45rem;margin-bottom:.8rem}
.ech{position:relative;min-height:2.6rem;border-radius:14px;border:3px solid #C9BCF2;background:#EFEAFF;color:#3F2A8C;font-weight:700;cursor:pointer;text-align:left;padding:.2rem .5rem .2rem 2rem;line-height:1.1;font-size:.78rem}
.ech::before{content:"";position:absolute;left:.5rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;border-radius:50%;border:2px dashed #A99BE0;background:#fff}
.ech.said{background:var(--sunlite);border-color:var(--orange);color:var(--ink)}
.ech.said::before{content:"\2605";border:0;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:.6rem}
.chal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14em),1fr));gap:.7rem;margin-bottom:.6rem}
.chal .say{margin:0}

/* talk plan and clock */
.plan{display:flex;flex-direction:column;gap:.5rem}
.prow{display:grid;grid-template-columns:2.3rem minmax(0,1fr);gap:.7rem;align-items:center;background:#fff;border-radius:18px;padding:.5rem .7rem;box-shadow:0 5px 0 #F3E3CC}
.prow i{font-style:normal;width:2.3rem;height:2.3rem;border-radius:42% 58% 55% 45% / 52% 44% 56% 48%;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center}
.prow p{margin:0;font-weight:600;font-size:.95rem}
.clock{display:flex;flex-direction:column;align-items:center;gap:.7rem;background:#fff;border-radius:var(--r);padding:1rem;box-shadow:0 7px 0 #F3E3CC}
.ring{width:min(15rem,60vw);aspect-ratio:1;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:3.4rem;font-variant-numeric:tabular-nums}
.speaker{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--coral);min-height:1.6rem;text-align:center}

/* class list */
.names{width:100%;min-height:9rem;border:3px solid var(--line);border-radius:18px;padding:.6rem .8rem;font-size:.9rem;background:#FFFBF5;resize:vertical;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.nch{min-height:2.3rem;padding:.15rem .8rem;border-radius:99px;border:3px solid var(--ocean);background:#fff;color:var(--ocean);font-weight:700;font-size:.8rem;cursor:pointer}
.nch.used{border-color:#9ED3B2;background:#E6F6EC;color:#14532F}
.nch.away{border-style:dashed;border-color:#C9B89F;color:#A99886;background:#fff;text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.7rem;font-weight:600;color:var(--muted);margin:.5rem 0}
.empty{color:var(--muted);font-weight:600}

/* picker overlay */
.pick{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,rgba(255,111,97,.97),rgba(255,154,82,.97) 45%,rgba(255,201,77,.97));display:none;flex-direction:column;align-items:center;justify-content:center;padding:4vh 4vw;gap:1.2rem}
.pick.show{display:flex}
.pick small{font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A1F14;font-size:.8rem}
.pname{font-family:var(--display);font-weight:800;font-size:clamp(3rem,12vw,9rem);line-height:.95;color:var(--ink);text-align:center;letter-spacing:-.03em;background:#fff;border-radius:36px;padding:.2em .5em;box-shadow:0 12px 0 rgba(0,0,0,.12);max-width:92vw;overflow-wrap:anywhere}
.pname.spin{color:#9AA3B5}
.pname .amp{display:block;font-size:.35em;color:var(--coral);margin:.1em 0}
.pick .btns{justify-content:center}
.pick .btn{min-height:2.8rem;font-size:.9rem;padding:.3rem 1.3rem}
.ptask{font-weight:700;font-size:1rem;color:#3A1F18;text-align:center;max-width:40ch}

.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--sun);padding:.5rem 1rem;border-radius:16px;font-weight:700;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:120;width:max-content;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* bottom */
.bottom{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-top:2px solid var(--line)}
.nb{min-height:2.6rem;min-width:7rem;padding:.2rem 1.2rem;border-radius:99px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:.85rem;cursor:pointer}
.nb.next{background:var(--coral)}
.nb:disabled{opacity:.35}

@media (max-width:1100px){ .brand{display:none} .pickbtn{flex:1} }
@media (max-width:760px){ .seq{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- polls ---------- */
function poll(id, opts){
  var p = S.polls[id] || {}, max = 0, total = 0;
  opts.forEach(function(o){ var v = p[o[1]] || 0; total += v; if(v > max) max = v; });
  return '<div class="poll">' + opts.map(function(o){
    var v = p[o[1]] || 0;
    return '<button class="pt' + (v && v === max ? ' top' : '') + '" type="button" data-poll="' + id + '" data-opt="' + esc(o[1]) + '">' +
      (o[0] ? '<span class="em">' + o[0] + '</span>' : '') + '<span class="lb">' + esc(o[1]) + '</span><span class="ct' + (v ? '' : ' z') + '">' + v + '</span></button>';
  }).join('') + '</div><div class="pollfoot"><span>' + (total ? total + ' hands' : 'Hands up! Tap to count.') + '</span>' + (total ? '<button type="button" data-pollreset="' + id + '">Clear</button>' : '') + '</div>';

  h += '<div class="band"><span>&#128241;</span>Put your top 3 photos in order. Tell the story to a classmate.</div>';
  h += '<div class="btns" style="margin:0 0 .8rem"><button class="btn sea" type="button" id="bModel">' + (S.model ? 'Hide the model' : 'Show a model story') + '</button><button class="btn cor" type="button" data-pick="1" data-task="Tell us your story. Use First, Then, After that and Finally.">&#127922; Who tells us their story?</button></div>';
  h += '<div class="model"' + (S.model ? '' : ' hidden') + '><p><b>First,</b> we <b>caught</b> the Metro and a train to Bondi Junction.</p><p><b>Then,</b> we <b>walked</b> along the beach. It was a bit of a <span class="ex">scorcher</span>!</p><p><b>After that,</b> I <b>asked</b> a lifesaver about the red and yellow flags. She <b>told me</b> to swim between them.</p><p><b>Finally,</b> we <b>had</b> lunch at Marks Park. I was <span class="ex">chuffed</span> with my photos.</p></div>';
  return h;
};

SC.expr = function(){
  var h = head(6);
  var n = Object.keys(S.said).filter(function(k){ return S.said[k]; }).length;
  if(!S.chal.length) newChal();
  h += '<p style="margin:0 0 .5rem;font-weight:600">When someone says one about Friday, tap it. <b>' + n + ' of 20</b> said.</p>';
  h += '<div class="egrid">' + BANK.map(function(x){ return '<button class="ech' + (S.said[x] ? ' said' : '') + '" type="button" data-said="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div>';
  h += '<h3>Challenge: say these about Friday</h3><div class="chal">' + S.chal.map(function(x){
    return '<div class="say"><b class="lab">' + esc(x) + '</b><q>' + mark(EXSENT[x] || x) + '</q><div class="btns"><button class="btn cor" type="button" data-pick="1" data-task="Say a sentence about Friday with: ' + esc(x) + '">&#127922; Who says it?</button></div></div>';
  }).join('') + '</div><div class="btns"><button class="btn sea" type="button" id="bChal">&#128256; Three new ones</button></div>';
  return h;
};
function newChal(){
  var pool = BANK.filter(function(x){ return !S.said[x] && (S.chal || []).indexOf(x) < 0; });
  if(pool.length < 3) pool = BANK.filter(function(x){ return !S.said[x]; });
  if(pool.length < 3) pool = BANK.slice();
  S.chal = shuffle(pool).slice(0, 3); save();
}

var tState = { left:60, run:false, iv:null, who:'' };
SC.talk = function(){
  var h = head(7);
  h += '<div class="cols"><div class="plan">' + [
    ['1','Last Friday, our class went to Sculpture by the Sea at Bondi.','#E0553F'],
    ['2','First, ___ (photo 1)','#C8661A'],
    ['3','Then, ___ (photo 2)','#0E8582'],
    ['4','After that, ___ (photo 3)','#0A6FB8'],
    ['5','Finally, my favourite part was ___. I\'d love to go again, because ___.','#23864F']
  ].map(function(r){ return '<div class="prow" style="--c:' + r[2] + '"><i>' + r[0] + '</i><p>' + r[1] + '</p></div>'; }).join('') +
    '<div class="tip" style="margin-top:.4rem"><b class="lab">Listener\'s job</b>Listen. At the end, ask one question.</div></div>';
  h += '<div class="clock"><div class="speaker" id="spk">' + (tState.who ? esc(tState.who) + ' is talking' : 'Talk for one minute') + '</div>' +
    '<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#F3E9DA" stroke-width="12"/><circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="#E0553F" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><b id="ringT">1:00</b></div>' +
    '<div class="btns"><button class="btn go" type="button" id="bClock">&#9654; Start</button><button class="btn ghost" type="button" id="bClockR">&#8635; Reset</button><button class="btn cor" type="button" id="bSpeaker">&#127922; Pick a speaker</button></div></div></div>';
  return h;
};

SC.me = function(){
  var h = head(8);
  h += '<div class="cols"><div><h3>We asked strangers...</h3>' + poll('asked', [['😶','Not yet'],['🙂','A few times'],['🤩','Lots!']]) +
    '<h3>We used Lesson 1 expressions...</h3>' + poll('used', [['🤔','Not yet'],['👍','A few'],['🔥','Lots!']]) + '</div>';
  h += '<div><h3>Next, we want to practise...</h3>' + poll('practise', [['❓','Asking questions'],['👂','Listening'],['⏪','Past tense'],['📖','New words'],['⭐','Lesson 1 expressions'],['⏱️','Talking for longer'],['🗣️','Pronunciation']]) +
    '<div class="say"><b class="lab">Tell the class</b><q>I\'m <span class="ex">chuffed</span> with my speaking, because ___.</q><q>Now I need to <span class="ex">knuckle down</span> and practise ___.</q></div>' +
    '<div class="btns"><button class="btn cor" type="button" data-pick="1" data-task="What do you want to practise next? Why?">&#127922; Who tells us?</button></div></div></div>';
  return h;
};

/* ---------- render ---------- */
function renderTabs(){
  $('tabs').innerHTML = STEPS.map(function(s, i){
    return '<button class="tab' + (i === cur ? ' on' : '') + '" type="button" data-tab="' + i + '" style="--c:' + s.c + '"' + (i === cur ? ' aria-current="page"' : '') + '><i>' + (i ? i : '&#128101;') + '</i>' + esc(s.tab) + '</button>';
  }).join('');
  var on = $('tabs').querySelector('.on'); if(on && on.scrollIntoView) on.scrollIntoView({ block:'nearest', inline:'nearest' });
}
function show(i, keep){
  if(i < 0 || i >= STEPS.length) return;
  if(i !== cur) stopClock();
  var y = $('stage').scrollTop;
  cur = i;
  $('slide').innerHTML = SC[STEPS[i].id]();
  renderTabs();
  $('bBack').disabled = cur === 0;
  $('bNext').disabled = cur === STEPS.length - 1;
  if(STEPS[i].id === 'talk') drawClock();
  $('stage').scrollTop = keep ? y : 0;
}
function rerender(){ show(cur, true); }

/* ---------- name picker ---------- */
var spinIv = null, lastPick = [], lastTask = '';
function drawFromHat(k, exclude){
  var here = present();
  S.hat = S.hat.filter(function(n){ return here.indexOf(n) > -1; });
  var out = [];
  for(var i = 0; i < k; i++){
    var pool = S.hat.filter(function(n){ return out.indexOf(n) < 0 && (exclude || []).indexOf(n) < 0; });
    if(!pool.length){
      S.hat = shuffle(here);
      toast('Everyone has had a turn. All names are back in the hat.');
      pool = S.hat.filter(function(n){ return out.indexOf(n) < 0 && (exclude || []).indexOf(n) < 0; });
      if(!pool.length) break;
    }
    var n = pool[Math.floor(Math.random() * pool.length)];
    out.push(n); S.hat.splice(S.hat.indexOf(n), 1);
  }
  out.forEach(function(n){ S.turns.push(n); });
  save();
  return out;
}
function pick(k, task, exclude){
  if(present().length < k){
    if(!S.names.length){ toast('Add the class names first'); show(0); }
    else toast('Not enough names here today');
    return;
  }
  var chosen = drawFromHat(k, exclude);
  if(!chosen.length) return;
  lastPick = chosen; lastTask = task || '';
  var box = $('pkName'), el = $('pick');
  $('pkLabel').textContent = chosen.length > 1 ? 'Your turn together' : 'Your turn';
  $('pkTask').textContent = lastTask;
  $('pkPartner').hidden = chosen.length > 1;
  el.classList.add('show');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var here = present(), steps = reduce ? 0 : 14, c = 0;
  clearInterval(spinIv);
  function land(){
    box.classList.remove('spin');
    box.innerHTML = chosen.map(esc).join('<span class="amp">&amp;</span>');
    $('pkAgain').focus();
    if(cur === 7){ tState.who = chosen.join(' & '); var sp = $('spk'); if(sp) sp.textContent = tState.who + ' is talking'; }
    if(cur === 0) rerender();
  }
  if(!steps){ land(); return; }
  box.classList.add('spin');
  spinIv = setInterval(function(){
    c++;
    box.textContent = here[Math.floor(Math.random() * here.length)];
    if(c >= steps){ clearInterval(spinIv); land(); }
  }, 75);
}
function closePick(){ clearInterval(spinIv); $('pick').classList.remove('show'); }
$('bPick').addEventListener('click', function(){ pick(1, ''); });
$('bPair').addEventListener('click', function(){ pick(2, ''); });
$('pkAgain').addEventListener('click', function(){ pick(lastPick.length || 1, lastTask); });
$('pkClose').addEventListener('click', closePick);
$('pkPartner').addEventListener('click', function(){
  if(present().length < 2){ toast('Not enough names here today'); return; }
  var first = lastPick[0];
  var p = drawFromHat(1, [first]);
  if(!p.length) return;
  lastPick = [first, p[0]];
  $('pkLabel').textContent = 'Your turn together';
  $('pkName').innerHTML = esc(first) + '<span class="amp">&amp;</span>' + esc(p[0]);
  $('pkPartner').hidden = true;
  if(cur === 0) rerender();
});

/* ---------- clicks ---------- */
document.addEventListener('click', function(e){
  var t;
  if((t = e.target.closest('[data-tab]'))){ show(+t.dataset.tab); return; }
  if((t = e.target.closest('[data-pick]'))){ pick(+t.dataset.pick, t.dataset.task || ''); return; }
  if((t = e.target.closest('#bSaveNames'))){
    var raw = $('namesBox').value;
    var list = raw.split(/[\n,;]+/).map(function(s){ return s.replace(/\s+/g,' ').trim(); }).filter(Boolean);
    var seen = {}; list = list.filter(function(n){ var k = n.toLowerCase(); if(seen[k]) return false; seen[k] = true; return true; });
    S.names = list;
    Object.keys(S.away).forEach(function(n){ if(list.indexOf(n) < 0) delete S.away[n]; });
    S.hat = shuffle(present()); S.turns = [];
    save(); rerender(); toast(list.length + ' names saved'); return;
  }
  if((t = e.target.closest('#bClearNames'))){ if(!confirm('Clear all the names?')) return; S.names = []; S.away = {}; S.hat = []; S.turns = []; save(); rerender(); return; }
  if((t = e.target.closest('[data-away]'))){
    var nm = t.dataset.away; S.away[nm] = !S.away[nm];
    if(S.away[nm]) S.hat = S.hat.filter(function(x){ return x !== nm; }); else if(S.hat.indexOf(nm) < 0) S.hat.push(nm);
    save(); rerender(); return;
  }
  if((t = e.target.closest('#bHat'))){ S.hat = shuffle(present()); S.turns = []; save(); rerender(); toast('Everyone is back in the hat'); return; }
  if((t = e.target.closest('#bClearAns'))){ if(!confirm('Clear all votes, ticks and expressions? The names stay.')) return; S.polls = {}; S.said = {}; S.talk = []; S.chal = []; save(); rerender(); toast('Cleared'); return; }
  if((t = e.target.closest('[data-poll]'))){ var id = t.dataset.poll, o = t.dataset.opt; S.polls[id] = S.polls[id] || {}; S.polls[id][o] = (S.polls[id][o] || 0) + 1; save(); rerender(); return; }
  if((t = e.target.closest('[data-pollreset]'))){ delete S.polls[t.dataset.pollreset]; save(); rerender(); return; }
  if((t = e.target.closest('#bQ'))){ S.qi = (S.qi + 1) % QUESTIONS.length; save(); rerender(); return; }
  if((t = e.target.closest('[data-ftype]'))){ S.ftype = t.dataset.ftype; save(); rerender(); return; }
  if((t = e.target.closest('[data-talk]'))){ var n = +t.dataset.talk, q = S.talk.indexOf(n); if(q > -1) S.talk.splice(q, 1); else S.talk.push(n); save(); rerender(); return; }
  if((t = e.target.closest('#bModel'))){ S.model = !S.model; save(); rerender(); return; }
  if((t = e.target.closest('[data-said]'))){ var x = t.dataset.said; S.said[x] = !S.said[x]; save(); rerender(); return; }
  if((t = e.target.closest('#bChal'))){ newChal(); rerender(); return; }
  if((t = e.target.closest('#bClock'))){ toggleClock(); return; }
  if((t = e.target.closest('#bClockR'))){ resetClock(); return; }
  if((t = e.target.closest('#bSpeaker'))){ resetClock(); pick(1, 'Talk for one minute about Friday.'); return; }
});
$('bBack').addEventListener('click', function(){ show(cur - 1); });
$('bNext').addEventListener('click', function(){ show(cur + 1); });
document.addEventListener('keydown', function(e){
  if(e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
  if($('pick').classList.contains('show')){ if(e.key === 'Escape') closePick(); return; }
  if(e.key === 'ArrowRight'){ show(cur + 1); }
  else if(e.key === 'ArrowLeft'){ show(cur - 1); }
  else if(e.key === 'n' || e.key === 'N'){ pick(1, ''); }
});
function setSize(){ document.documentElement.setAttribute('data-size', S.size); }
$('bMinus').addEventListener('click', function(){ if(S.size > 1){ S.size--; setSize(); save(); } });
$('bPlus').addEventListener('click', function(){ if(S.size < 3){ S.size++; setSize(); save(); } });
$('bFull').addEventListener('click', function(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){} });

/* ---------- one-minute clock ---------- */
var beepEl = null;
function makeBeep(){
  var rate = 22050, n = Math.floor(rate * 1.0), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  function s(o, t){ for(var i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); }
  s(0,'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8,'WAVE'); s(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); s(36,'data'); v.setUint32(40,n*2,true);
  var bs = [[0,.15,880],[.22,.37,880],[.44,.85,1175]];
  for(var i = 0; i < n; i++){ var t = i / rate, x = 0;
    for(var k = 0; k < bs.length; k++){ var b = bs[k]; if(t >= b[0] && t < b[1]){ var env = Math.min(1, (t - b[0]) / .01, (b[1] - t) / .02); x = (Math.sin(2 * Math.PI * b[2] * t) > 0 ? 1 : -1) * .45 * env; } }
    v.setInt16(44 + i * 2, x * 32767, true); }
  return new Audio(URL.createObjectURL(new Blob([buf], { type:'audio/wav' })));
}
try{ beepEl = makeBeep(); }catch(e){}
function unlock(){ if(!beepEl) return; try{ beepEl.muted = true; var p = beepEl.play(); var d = function(){ beepEl.pause(); beepEl.currentTime = 0; beepEl.muted = false; }; if(p && p.then) p.then(d).catch(function(){ beepEl.muted = false; }); else d(); }catch(e){} }
function beep(){ if(!beepEl) return; try{ beepEl.muted = false; beepEl.currentTime = 0; var p = beepEl.play(); if(p && p.catch) p.catch(function(){}); }catch(e){} }
function drawClock(){
  var r = $('ringT'), a = $('ringArc'); if(!r || !a) return;
  var s = Math.max(0, Math.ceil(tState.left));
  r.textContent = Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  a.setAttribute('stroke-dashoffset', String(326.7 * (1 - s / 60)));
  var b = $('bClock'); if(b) b.innerHTML = tState.run ? '&#10074;&#10074; Pause' : (tState.left < 60 && tState.left > 0 ? '&#9654; Keep going' : '&#9654; Start');
}
function toggleClock(){
  if(tState.run){ stopClock(); drawClock(); return; }
  unlock();
  if(tState.left <= 0) tState.left = 60;
  tState.run = true; var last = Date.now();
  tState.iv = setInterval(function(){
    var now = Date.now(); tState.left -= (now - last) / 1000; last = now;
    if(tState.left <= 0){ tState.left = 0; stopClock(); drawClock(); beep(); toast('Time! Now swap.'); return; }
    drawClock();
  }, 200);
  drawClock();
}
function stopClock(){ if(tState.iv){ clearInterval(tState.iv); tState.iv = null; } tState.run = false; }
function resetClock(){ stopClock(); tState.left = 60; tState.who = ''; var sp = $('spk'); if(sp) sp.textContent = 'Talk for one minute'; drawClock(); }

/* ---------- start ---------- */
(function(){
  try{ var v = localStorage.getItem(KEY); if(v){ var o = JSON.parse(v), f = fresh(); for(var k in f) S[k] = (k in o) ? o[k] : f[k]; } }catch(e){}
  setSize();
  show(S.names.length ? 1 : 0);
})();
</script>
